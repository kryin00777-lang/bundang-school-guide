<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="삼평중학교 학생을 위한 분당·판교 고등학교 25곳 성향 맞춤 추천 웹앱">
<title>분당 고교 길잡이</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}

/* Layout: 휴대폰 앱처럼 한 줄 기둥(최대 560px), 상단 고정 바 + 화면 전환 */
:root{
  --bg:#f4f6f1; --surface:#ffffff; --ink:#1b2420; --muted:#5d6b64; --line:#dde3dc;
  --accent:#1f5c4a; --accent-soft:#e3efe9; --marker:#f2d14a; --marker-ink:#3b3000;
  --good:#2f7a4f; --warn:#a2611a; --warn-soft:#fbeedd;
  --display:"Do Hyeon","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1714; --surface:#17221e; --ink:#e6ece8; --muted:#9aaba3; --line:#2a3833;
  --accent:#7cc9ab; --accent-soft:#1d3029; --marker:#e3c346; --marker-ink:#2a2200;
  --good:#7cc99a; --warn:#e2a85e; --warn-soft:#2e2416; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1714; --surface:#17221e; --ink:#e6ece8; --muted:#9aaba3; --line:#2a3833;
  --accent:#7cc9ab; --accent-soft:#1d3029; --marker:#e3c346; --marker-ink:#2a2200;
  --good:#7cc99a; --warn:#e2a85e; --warn-soft:#2e2416; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;word-break:keep-all}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px;min-height:54px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--display);font-size:21px;color:var(--accent);flex:1;cursor:pointer}
.brand small{font-family:var(--body);font-size:12px;color:var(--muted);margin-left:6px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--marker);outline-offset:2px}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;font-size:13px}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;line-height:1.25;margin:0}
h1{font-size:30px} h2{font-size:22px} h3{font-size:18px}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:14px}
.mark{background:linear-gradient(transparent 58%,var(--marker) 58%);color:inherit;padding:0 2px}
.hero{padding-block:26px 8px;display:flex;flex-direction:column;gap:12px}
.hero p{color:var(--muted)}
.cta{background:var(--accent);color:var(--bg);border:0;border-radius:14px;padding:15px 18px;font-family:var(--display);font-size:20px;width:100%}
.ghost{background:transparent;border:1.5px solid var(--accent);color:var(--accent);border-radius:14px;padding:12px 16px;font-weight:700;width:100%}
.section-label{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-top:22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.school-row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 15px}
.school-row:hover{border-color:var(--accent)}
.school-row .nm{font-family:var(--display);font-size:18px}
.school-row .meta{font-size:12.5px;color:var(--muted);grid-column:1/-1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:500}
.chip.pub{background:transparent;border:1px solid var(--line);color:var(--muted)}
.chip.spe{border:1px solid var(--warn);color:var(--warn);background:transparent}
.spe-card{border-style:dashed}
.rank-no.spe-no{background:var(--warn-soft);color:var(--warn);font-size:15px}
.admit{margin-top:12px;background:var(--warn-soft);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.admit b{color:var(--warn);font-size:13px}
.dist{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);white-space:nowrap}
/* quiz */
.progress{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:18px}
.progress>i{display:block;height:100%;background:var(--accent);transition:width .3s}
.qnum{font-size:13px;color:var(--muted);margin-top:14px;font-variant-numeric:tabular-nums}
.qtext{font-family:var(--display);font-size:24px;margin:6px 0 16px;line-height:1.3}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px 15px;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted)}
.opt.sel .k{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.opt small{display:block;color:var(--muted);font-size:12.5px}
.other-box{display:flex;flex-direction:column;gap:6px;background:var(--accent-soft);border-radius:14px;padding:14px 15px}
.other-box label{font-weight:700;font-size:14px}
.other-box input{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;box-sizing:border-box}
.other-box input:focus{outline:none;border-color:var(--accent)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:14px}
.field input{font:inherit;font-size:17px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:12px;width:100%;box-sizing:border-box;letter-spacing:.02em}
.field input:focus{outline:none;border-color:var(--accent)}
.note.err{color:var(--warn);font-weight:500}
.user-btn{max-width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums}
.choice-row{display:grid;grid-template-columns:62px 1fr;gap:10px;align-items:center}
.choice-no{font-family:var(--display);font-size:18px;color:var(--accent)}
.choice-row select{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:11px 10px;width:100%;min-width:0}
.choice-row select:focus{outline:none;border-color:var(--accent)}
.summary{margin-top:22px;background:var(--accent);color:var(--bg);border-radius:16px;padding:18px 16px;display:flex;flex-direction:column;gap:12px}
.summary .note{color:var(--bg);opacity:.85}
.sum-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.sum-who{font-size:13px;font-variant-numeric:tabular-nums;opacity:.9}
.sum-row{display:grid;grid-template-columns:56px 1fr;gap:2px 10px;align-items:center;background:color-mix(in srgb,var(--bg) 14%,transparent);border-radius:12px;padding:10px 12px}
.sum-no{grid-row:span 2;font-family:var(--display);font-size:17px;background:var(--marker);color:var(--marker-ink);border-radius:8px;text-align:center;padding:4px 0}
.sum-nm{font-family:var(--display);font-size:18px;min-width:0}
.sum-meta{font-size:12px;opacity:.85;font-variant-numeric:tabular-nums}
.empty-row .sum-no{grid-row:auto;background:transparent;color:var(--bg);border:1.5px dashed color-mix(in srgb,var(--bg) 60%,transparent)}
.submit-box{display:flex;flex-direction:column;gap:10px;border-top:1px solid color-mix(in srgb,var(--bg) 35%,transparent);padding-top:12px}
.agree{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;cursor:pointer}
.agree input{width:18px;height:18px;margin-top:2px;flex:none;accent-color:var(--marker)}
.submit-btn{background:var(--marker);color:var(--marker-ink);border:0;border-radius:12px;padding:13px;font-family:var(--display);font-size:19px}
.submit-box.done{flex-direction:column;gap:2px;background:var(--marker);color:var(--marker-ink);border:0;border-radius:12px;padding:12px 14px}
.submit-box.done span{font-size:12.5px}
.live{display:flex;flex-direction:column;gap:12px}
.live-head{display:flex;align-items:center;gap:8px}
.live-head h2{flex:1}
.live-dot{width:9px;height:9px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 50%,transparent);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.live-row .mine{font-size:11px;color:var(--marker-ink);background:var(--marker);border-radius:5px;padding:0 5px;font-weight:700}
.live-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.nav-row{display:flex;gap:10px;margin-top:18px}
.nav-row button{flex:1}
button:disabled{opacity:.4;cursor:not-allowed}
/* result */
.rank-card{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:left;width:100%}
.rank-card.first{border:2px solid var(--accent)}
.rank-top{display:flex;align-items:center;gap:12px}
.rank-no{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-size:22px;background:var(--accent-soft);color:var(--accent)}
.first .rank-no{background:var(--marker);color:var(--marker-ink)}
.rank-name{font-family:var(--display);font-size:21px;flex:1;min-width:0}
.fit{font-variant-numeric:tabular-nums;text-align:right;font-size:12px;color:var(--muted)}
.fit b{display:block;font-family:var(--display);font-weight:400;font-size:24px;color:var(--accent)}
.meter{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.meter>i{display:block;height:100%;background:var(--accent)}
.why{margin:0;padding-left:18px;font-size:13.5px}
.profile{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:13px}
.profile .bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.profile .bar>i{display:block;height:100%;background:var(--accent)}
.profile span:last-child{font-variant-numeric:tabular-nums;color:var(--muted)}
/* detail */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-top:16px;scrollbar-width:none}
.tab{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:13.5px}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.kv div{background:var(--accent-soft);border-radius:12px;padding:10px 4px}
.kv b{display:block;font-family:var(--display);font-weight:400;font-size:22px;color:var(--accent);font-variant-numeric:tabular-nums}
.kv span{font-size:12px;color:var(--muted)}
.feat h3{margin-bottom:6px}
.feat ul,.pc ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.term{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.term:first-child{border-top:0;padding-top:0}
.term-h{font-family:var(--display);font-size:17px;color:var(--accent)}
.fixed{font-size:13.5px}
.fixed b{font-size:12px;color:var(--muted);display:block;font-weight:700}
.pick{background:var(--bg);border-radius:10px;padding:9px 11px;font-size:13px;display:flex;gap:10px;align-items:flex-start}
.pick .n{flex:none;font-weight:700;font-size:12px;background:var(--marker);color:var(--marker-ink);border-radius:6px;padding:1px 7px;margin-top:2px}
.pc{display:grid;gap:12px}
.pc .good h3{color:var(--good)} .pc .bad h3{color:var(--warn)}
.pc .bad{background:var(--warn-soft);border-color:transparent}
.route{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.route div{border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.route b{display:block;font-family:var(--display);font-weight:400;font-size:21px;font-variant-numeric:tabular-nums}
.route span{font-size:12px;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted)}
a{color:var(--accent);font-weight:500}
.linkbtn{display:block;text-align:center;text-decoration:none;border:1.5px solid var(--accent);border-radius:12px;padding:11px;font-weight:700}
.hbar{display:grid;grid-template-columns:96px 1fr 44px;gap:8px;align-items:center;font-size:13px}
.hbar .track{height:14px;background:var(--line);border-radius:5px;overflow:hidden;display:flex}
.hbar .track i{display:block;height:100%}
.hbar .num{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.hbar.me .nm{font-weight:700;color:var(--accent)}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.g1{background:var(--accent)} .g2{background:color-mix(in srgb,var(--accent) 62%,var(--bg))} .g3{background:color-mix(in srgb,var(--accent) 32%,var(--bg))}
.exp{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:13px}
.exp dt{color:var(--muted);font-weight:700;white-space:nowrap}
.exp dd{margin:0}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:16px;text-align:center;color:var(--muted);font-size:13.5px}
footer{margin-top:28px;font-size:12px;color:var(--muted)}
@media (max-width:440px){.brand small{display:none}.brand{white-space:nowrap}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

  for(const k in KW){ if(KW[k].some(w=>t.includes(w))) hit.push(k); }
  hit.forEach(k=>{
    if(k==="art"||k==="sport"){ v.hum=(v.hum||0)+1; v.explore=(v.explore||0)+2; }
    else if(k==="voc"){ v.glob=(v.glob||0)+1; v.explore=(v.explore||0)+2; }
    else v[k]=(v[k]||0)+(hit.length>1?2:3); });
  return {v, hit};
}
const DREAM_LABEL = {sci:"과학·의생명",it:"공학·AI·정보",hum:"인문·사회",glob:"경영·국제",art:"예술·창작",voc:"요리·미용 등 실무",sport:"체육"};

function profile(){
  const p = {sci:0,it:0,hum:0,glob:0,study:0,explore:0,art:0,voc:0}; let near=1, size="any";
  state.ans.forEach((a,i)=>{ if(a===null) return; const o=Q[i].o[a];
    const v = o.other ? classifyDream(state.otherText).v : o.v;
    if(v) for(const k in v) p[k]+=v[k];
    if(o.other){ const h=classifyDream(state.otherText).hit; if(h.includes("art")) p.art+=15; if(h.includes("voc")) p.voc+=12; }
    if(o.near!==undefined) near=o.near; if(o.size) size=o.size; });
  return {p,near,size};
}
function scoreList(pool, p, near, size){
  const keys = Object.keys(p).filter(k => pool===SP || (k!=="art" && k!=="voc"));
  let theo = 0; keys.forEach(k=>{ theo += p[k]*3; }); theo += near*3*1.5 + (size==="any"?0:6);
  return pool.filter(s=> !(state.gender==="m" && s.gender==="여학교")).map(s=>{
    const parts = {}; let sc=0;
    keys.forEach(k=>{ parts[k]=p[k]*(s.w[k]||0); sc+=parts[k]; });
    const nearPts = near*s.near*1.5; sc+=nearPts;
    let sizePts = 0; if(size==="big") sizePts=s.w.big*2; else if(size==="small") sizePts=(3-s.w.big)*2; sc+=sizePts;
    return {s, sc, fit: theo? Math.min(100,Math.round(sc/theo*100)):0, parts, nearPts, sizePts};
  }).sort((a,b)=>b.sc-a.sc || b.s.near-a.s.near);
}
function rank(){
  const {p,near,size} = profile();
  return {list: scoreList(S,p,near,size), special: scoreList(SP,p,near,size), p, near, size};
}
const REASON = {
  sci:"과학중점·의생명 계열 프로그램과 실험 과목이 꿈과 잘 맞아요",
  it:"정보·AI·공학 과목과 코딩 활동이 관심사와 잘 맞아요",
  hum:"독서·토론·인문사회 활동이 강점과 잘 맞아요",
  glob:"경영·국제 관련 과목과 교류 활동이 관심사와 맞아요",
  study:"관리형 자기주도학습 환경이 공부 스타일과 맞아요",
  explore:"탐구·프로젝트 중심 활동이 공부 스타일과 맞아요",
  art:"전공 실기와 창작 중심 교육과정이 꿈과 잘 맞아요",
  voc:"현장 실습 중심 학과와 자격증 교육이 꿈과 잘 맞아요"};
function reasons(r){
  const out = Object.entries(r.parts).filter(([k,v])=>v>0).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([k])=>REASON[k]);
  if(r.nearPts>=6) out.push(`삼평중에서 ${r.s.km}km, 통학 부담이 적어요`);
  if(r.sizePts>=6) out.push(state.ans[5]===0?"학년당 "+r.s.cls[0]+"학급으로 과목·동아리 선택지가 넓어요":"학년당 "+r.s.cls[0]+"학급의 아담한 규모예요");
  return out.slice(0,3);
}

async function submitChoice(){
  const btn=document.getElementById("submitBtn"), msg=document.getElementById("submitMsg");
  const {list} = rank(); const nm = id => byId(id).short;
  const payload = { studentId:state.student.id, name:state.student.name,
    gender: state.gender==="f"?"여":"남",
    choice: state.choice.map(nm),
    rec: list.slice(0,3).map(r=>`${r.s.short}(${r.fit})`),
    dream: isOther(1,state.ans[1]) ? state.otherText : "",
    answers: state.ans.map(a=>"ABCDE"[a]).join(""),
    clientTime: new Date().toISOString() };
  btn.disabled=true; btn.textContent="제출하는 중…"; msg.textContent="";
  const body = JSON.stringify(payload);
  let ok=false;
  try{
    const res = await fetch(SUBMIT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body});
    const j = await res.json().catch(()=>({ok:res.ok}));
    ok = !!j.ok; if(!ok) msg.textContent = "제출 내용이 올바르지 않아요. 학번과 이름을 확인해 주세요.";
  }catch(e){
    try{ await fetch(SUBMIT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body}); ok=true; }
    catch(e2){ msg.textContent = "인터넷 연결을 확인한 뒤 다시 눌러 주세요."; }
  }
  if(ok){ state.submitted={at:new Date().toISOString(), choice:[...state.choice]}; save(); refreshChoices(); setTimeout(loadStats, 1500); }
  else { btn.disabled=false; btn.textContent="다시 제출하기"; }
}
function refreshChoices(){
  const {list} = rank();
  [0,1,2].forEach(i=>{ const el=document.getElementById("choice"+i); if(el) el.innerHTML = choiceOptions(list,i); });
  const sum=document.getElementById("choiceSummary"); if(sum) sum.innerHTML = choiceSummary(list);
}
function detail(){
  const s = byId(state.schoolId); const t = state.tab;
  const tabs = [["feat","특색 사업"],["cur","교육과정"],["pc","장점·단점"],["route","통학"],["size","학급 수"],["grad","진학 현황"]];
  let body="";
  if(t==="feat") body = `<div class="stack">${s.feats.map(f=>`<div class="card feat"><h3>${f.t}</h3><ul>${f.d.map(x=>`<li>${x}</li>`).join("")}</ul></div>`).join("")}</div>`;
  if(t==="cur") body = `<p class="note">2027학년도 입학생 3개년 편제표${s.cat==="spe"?"를 학과·전공별로 요약했어요":""} · 괄호 안은 학점, ↔는 둘 중 하나</p>
   <div class="card stack" style="margin-top:8px">${s.cur.map(([term,fx,pk])=>`<div class="term"><span class="term-h">${/^\d-\d$/.test(term)?`${term[0]}학년 ${term[2]}학기`:term}</span>
     <p class="fixed"><b>${s.cat==="spe"?"주요 과목":"학교 지정 과목"}</b>${fx}</p>
     ${pk.map(([n,l])=>`<div class="pick"><span class="n">${n}</span><span>${l}</span></div>`).join("")}</div>`).join("")}</div>
   ${s.ext.length?`<p class="section-label">2026년 개설 · 학생 과목 선택권 확대(공동교육과정 등)</p>
   <dl class="card exp" style="margin-top:8px">${s.ext.map(([g,l])=>`<dt>${g}</dt><dd>${l}</dd>`).join("")}</dl>`:""}`;
  if(t==="pc") body = `<div class="pc"><div class="card good"><h3>이런 점이 좋아요</h3><ul>${s.pros.map(x=>`<li>${x}</li>`).join("")}</ul></div>
   <div class="card bad"><h3>이런 점은 고려해요</h3><ul>${s.cons.map(x=>`<li>${x}</li>`).join("")}</ul></div></div>
   <p class="note" style="margin-top:10px">학교 자료를 바탕으로 정리한 참고 의견이에요. 학교 설명회에서 직접 확인해 보세요.</p>`;
  if(t==="route") body = `<div class="card stack"><p><b>삼평중학교 → ${s.short}</b><br><span class="note">${s.addr}</span></p>
    <div class="route"><div><b>${s.km.replace("약 ","")}<small style="font-size:13px">km</small></b><span>거리(약)</span></div><div><b>${s.bus}</b><span>버스</span></div><div><b>${s.walk}</b><span>도보</span></div></div>
    <p class="note">자전거 약 ${s.bike} · 모두 추정치이며 배차 간격과 등교 시간대 교통에 따라 달라져요.</p>
    <a class="linkbtn" href="https://map.kakao.com/?sName=${encodeURIComponent("삼평중학교")}&eName=${encodeURIComponent(s.name)}" target="_blank" rel="noopener">카카오맵에서 실제 경로 보기</a></div>`;
  if(t==="size"){ const tot=s.stu.reduce((a,b)=>a+b,0);
    body = `<div class="card stack"><div class="kv">${[0,1,2].map(i=>`<div><b>${s.cls[i]}</b><span>${i+1}학년 학급<br>${s.stu[i]}명</span></div>`).join("")}</div>
    <p class="note">전교생 ${tot}명 · 학급당 평균 약 ${Math.round(tot/(s.cls[0]*3))}명</p></div>
    <p class="section-label">${s.cat==="spe"?"따로 지원하는 학교":"평준화 일반고"} ${(s.cat==="spe"?SP:S).length}곳 전교생 비교</p>${sizeChart(s.id, s.cat==="spe"?SP:S)}`; }
  if(t==="grad") body = `<div class="empty">받은 자료(2026 교육과정 운영 현황)에는 졸업생 진학 실적이 들어 있지 않아요.<br>학교알리미의 ‘졸업생의 진로 현황’ 공시에서 대학 진학률을 확인할 수 있어요.</div>
    <div class="stack" style="margin-top:12px"><a class="linkbtn" href="https://www.schoolinfo.go.kr" target="_blank" rel="noopener">학교알리미에서 ${s.short} 진로 현황 보기</a>
    <a class="linkbtn" href="${s.web}" target="_blank" rel="noopener">${s.short} 홈페이지</a></div>
    <p class="note" style="margin-top:10px">학교알리미에서 학교 이름을 검색한 뒤 ‘학생 현황 → 졸업생의 진로 현황’ 메뉴를 열면 돼요.</p>`;
  return `<section class="hero" style="padding-bottom:0"><div class="chips"><span class="chip pub">${s.type} ${s.kind}</span><span class="chip pub">${s.gender}</span>${s.tags.map(t=>`<span class="chip">${t}</span>`).join("")}</div>
    <h1>${s.name}</h1><p class="note">${s.addr} · ☎ <span style="user-select:all">${s.tel}</span></p>
    ${s.cat==="spe"?`<div class="admit"><b>지원 방법 · 평준화 배정과 별도</b><p>${s.admit}</p></div>`:""}</section>
  <nav class="tabs" role="tablist">${tabs.map(([k,l])=>`<button class="tab ${t===k?"on":""}" role="tab" aria-selected="${t===k}" data-tab="${k}">${l}</button>`).join("")}</nav>
  <div style="margin-top:14px">${body}</div>${footer()}`;
}
function sizeChart(me, pool=S){
  const max = Math.max(...pool.map(s=>s.stu.reduce((a,b)=>a+b,0)));
  return `<div class="card stack" style="margin-top:8px">
   <div class="legend"><span><i class="g1"></i>1학년</span><span><i class="g2"></i>2학년</span><span><i class="g3"></i>3학년</span></div>
   ${[...pool].sort((a,b)=>b.stu.reduce((x,y)=>x+y)-a.stu.reduce((x,y)=>x+y)).map(s=>{const tot=s.stu.reduce((a,b)=>a+b,0);
    return `<div class="hbar ${s.id===me?"me":""}"><span class="nm">${s.short}<br><small class="note">${s.cls[0]}학급×3</small></span>
     <span class="track" title="${s.stu.join(" / ")}명">${s.stu.map((v,i)=>`<i class="g${i+1}" style="width:${v/max*100}%"></i>`).join("")}</span><span class="num">${tot}</span></div>`}).join("")}
  </div>`;
}
function compare(){
  return `<section class="hero"><h1>학교 규모 비교</h1><p>학급 수가 많을수록 개설 과목과 동아리 선택지가 넓고, 적을수록 선생님과 더 가까운 편이에요.</p></section>
  <p class="section-label">평준화 일반고 ${S.length}곳</p>
  ${sizeChart(null, S)}
  <p class="section-label">따로 지원하는 학교 ${SP.length}곳</p>
  ${sizeChart(null, SP)}
  <div class="card" style="margin-top:14px;overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;min-width:360px">
   <thead><tr style="text-align:left;color:var(--muted)"><th style="padding:6px 4px">학교</th><th>1학년</th><th>2학년</th><th>3학년</th><th>거리</th></tr></thead>
   <tbody>${[...byDist(S),...byDist(SP)].map(s=>`<tr style="border-top:1px solid var(--line)"><td style="padding:8px 4px"><a href="#" data-school="${s.id}">${s.short}</a></td>${s.cls.map((c,i)=>`<td>${c}학급 (${s.stu[i]})</td>`).join("")}<td>${s.km}km</td></tr>`).join("")}</tbody></table></div>
  ${footer()}`;
}
function login(){
  const st = state.student, err = state.loginErr||{};
  const showForm = !st || state.switching;
  const form = `<form class="card stack login-form" id="loginForm" novalidate>
    <div class="field"><label for="stuId">학번</label>
      <input id="stuId" name="stuId" type="text" inputmode="numeric" maxlength="5" placeholder="예: 10305" autocomplete="off" value="${esc(err.id||"")}" aria-describedby="stuIdHelp">
      <p class="note ${err.idMsg?"err":""}" id="stuIdHelp">${err.idMsg||"학년 1자리 + 반 2자리 + 번호 2자리 (1학년 3반 5번 → 10305)"}</p></div>
    <div class="field"><label for="stuName">이름</label>
      <input id="stuName" name="stuName" type="text" maxlength="20" placeholder="예: 김삼평" autocomplete="off" value="${esc(err.name||"")}">
      ${err.nameMsg?`<p class="note err">${err.nameMsg}</p>`:""}</div>
    <button class="cta" type="submit">입장하기</button>
    ${st?`<button class="ghost" type="button" id="cancelSwitch">취소</button>`:""}
  </form>`;
  return `<section class="hero"><p class="note">삼평중학교 · 분당 고교 길잡이</p>
    <h1>반가워요!<br>먼저 <span class="mark">학번과 이름</span>을 알려 주세요</h1>
    <p>입력한 정보는 추천 결과에 이름을 붙이는 데만 쓰여요.</p></section>
  ${showForm ? form : `<div class="card stack">
      <p><b style="font-size:17px">${esc(st.id)} ${esc(st.name)}</b> 학생이 마지막으로 이용했어요.</p>
      <button class="cta" id="continueBtn">${esc(st.name)} 학생으로 계속하기</button>
      <button class="ghost" id="switchBtn">다른 학생이에요 (새로 입장)</button></div>`}
  <p class="note" style="margin-top:14px">학번과 이름, 답변은 이 기기의 브라우저에만 저장되고 다른 곳으로 보내지 않아요. 교실 태블릿처럼 여러 명이 함께 쓰는 기기라면, 다 쓴 뒤 오른쪽 위 이름을 눌러 다음 친구에게 넘겨 주세요.</p>`;
}
function doLogin(form){
  const id = form.stuId.value.trim(), name = form.stuName.value.trim().replace(/\s+/g," ");
  const e = {id, name};
  if(!/^\d{4,5}$/.test(id)) e.idMsg = "학번은 숫자 4~5자리로 적어 주세요. (예: 10305)";
  if(!/^[가-힣a-zA-Z ]{2,20}$/.test(name)) e.nameMsg = "이름은 한글이나 영문 2글자 이상으로 적어 주세요.";
  if(e.idMsg || e.nameMsg){ state.loginErr = e; render(); document.getElementById(e.idMsg?"stuId":"stuName").focus(); return; }
  const prev = state.student;
  if(!prev || prev.id!==id || prev.name!==name) resetAnswers();
  state.student = {id, name}; state.switching=false; state.loginErr={}; save(); go("home");
}
/* ---------- 친구들 현황 (실시간 집계) ---------- */
let statsData=null, statsErr="", statsTimer=null, statsBusy=false;
async function loadStats(){
  if(!SUBMIT_URL || statsBusy) return;
  if(!SHOW_STATS_BEFORE_SUBMIT && !state.submitted) return;
  statsBusy=true; paintStats();
  try{
    const r = await fetch(SUBMIT_URL+(SUBMIT_URL.includes("?")?"&":"?")+"stats=1&t="+Date.now());
    const j = await r.json();
    if(j && j.ok){ statsData=j; statsErr=""; } else statsErr="현황을 불러오지 못했어요.";
  }catch(e){ statsErr="현황을 불러오지 못했어요. 인터넷 연결을 확인해 주세요."; }
  statsBusy=false; paintStats();
}
function paintStats(){ const el=document.getElementById("liveStats"); if(el) el.innerHTML=statsHTML(); }
function statsHTML(){
  if(!SUBMIT_URL) return `<div class="empty">선생님이 제출 주소를 설정하면, 우리 학교 친구들이 고른 희망 학교가 여기에 실시간으로 보여요.</div>`;
  if(!SHOW_STATS_BEFORE_SUBMIT && !state.submitted) return `<div class="empty">내 지망을 먼저 제출하면 친구들의 현황을 볼 수 있어요.<br>친구들 선택에 휩쓸리지 않고 내 생각대로 고르기 위해서예요.</div>`;
  if(!statsData) return `<div class="empty">${statsErr || "친구들의 현황을 불러오는 중이에요…"}</div>`;
  const d = statsData;
  if(d.hidden) return `<div class="empty">지금까지 ${d.total}명이 제출했어요.<br>${d.min}명 이상 모이면 현황을 보여 줄게요. 누가 어디를 골랐는지 짐작할 수 없게 하기 위해서예요.</div>`;
  const sc = d.schools||{};
  const rows = S.map(s=>({s, c: sc[s.short]||[0,0,0]})).map(r=>({...r, t:r.c[0]+r.c[1]+r.c[2]}))
    .sort((a,b)=>b.c[0]-a.c[0] || b.t-a.t);
  const max = Math.max(1,...rows.map(r=>r.t));
  const mine = state.choice[0];
  const upd = d.updated ? fmtTime(d.updated) : "";
  return `<div class="legend" style="margin-bottom:10px"><span><i class="g1"></i>1지망</span><span><i class="g2"></i>2지망</span><span><i class="g3"></i>3지망</span></div>
   <div class="stack" style="gap:10px">${rows.map((r,i)=>`<div class="hbar live-row ${r.s.id===mine?"me":""}">
     <span class="nm">${r.s.short}${r.s.id===mine?`<br><small class="mine">내 1지망</small>`:""}</span>
     <span class="track" title="1지망 ${r.c[0]} · 2지망 ${r.c[1]} · 3지망 ${r.c[2]}">${r.c.map((v,k)=>`<i class="g${k+1}" style="width:${v/max*100}%"></i>`).join("")}</span>
     <span class="num">${r.c[0]}명</span></div>`).join("")}</div>
   <p class="note" style="margin-top:10px">오른쪽 숫자는 1지망으로 고른 학생 수예요. 막대 길이는 1~3지망에서 이름이 나온 전체 횟수예요.</p>
   <div class="live-foot"><span class="note">참여 ${d.total}명${upd?` · ${upd} 기준`:""} · 30초마다 자동 갱신</span>
     <button class="icon-btn" id="refreshStats" type="button" ${statsBusy?"disabled":""}>${statsBusy?"갱신 중…":"지금 새로고침"}</button></div>
   ${statsErr?`<p class="note err">${statsErr}</p>`:""}`;
}
function render(){
  if(!state.student && state.view!=="login") state.view="login";
  backBtn.hidden = state.view==="home" || state.view==="login";
  userBtn.hidden = !state.student || state.view==="login";
  if(state.student) userBtn.textContent = `${state.student.id} ${state.student.name}`;
  app.innerHTML = state.view==="login"?login(): state.view==="home"?home(): state.view==="quiz"?quiz(): state.view==="result"?result(): state.view==="school"?detail(): compare();
  if(state.view==="result"){
    if(!statsTimer){ loadStats(); statsTimer=setInterval(()=>{ if(!document.hidden) loadStats(); }, 30000); }
  } else if(statsTimer){ clearInterval(statsTimer); statsTimer=null; }
}
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden && state.view==="result") loadStats(); });

/* ---------- 이벤트 ---------- */
app.addEventListener("click", e=>{
  const sch = e.target.closest("[data-school]");
  if(sch){ e.preventDefault(); go("school",{schoolId:sch.dataset.school, tab:"feat", from:state.view}); return; }
  const opt = e.target.closest("[data-opt]");
  if(opt){ const i=+opt.dataset.opt;
    if(state.step===-1) state.gender=GENDER_Q.o[i].g; else state.ans[state.step]=i;
    save(); render();
    if(state.step>-1 && Q[state.step].o[i].other){ const inp=document.getElementById("otherText"); if(inp){ inp.focus(); inp.scrollIntoView({block:"center",behavior:"smooth"}); } return; }
    setTimeout(()=>{ if(state.step<Q.length-1){ state.step++; render(); } else { go("result"); } }, 260); return; }
  const tab = e.target.closest("[data-tab]"); if(tab){ state.tab=tab.dataset.tab; render(); return; }
  const id = e.target.id;
  if(id==="start"||id==="retry"){ resetAnswers(); save(); go("quiz",{step:-1}); }
  if(id==="continueBtn") go("home");
  if(id==="switchBtn"){ state.switching=true; state.loginErr={}; render(); document.getElementById("stuId").focus(); }
  if(id==="cancelSwitch"){ state.switching=false; state.loginErr={}; render(); }
  if(id==="showRes") go("result");
  if(id==="cmp") go("compare",{from:state.view});
  if(id==="next"){ if(state.step<Q.length-1){ state.step++; render(); } else go("result"); }
  if(id==="prev"){ if(state.step===-1) go("home"); else { state.step--; render(); } }
});
app.addEventListener("change", e=>{
  if(e.target.id==="agree"){ document.getElementById("submitBtn").disabled = !e.target.checked; return; }
  const sel = e.target.closest("[data-choice]"); if(!sel) return;
  state.choice[+sel.dataset.choice] = sel.value || null; save(); refreshChoices();
});
app.addEventListener("click", e=>{
  if(e.target.id==="fillRec"){ state.choice = rank().list.slice(0,3).map(r=>r.s.id); save(); refreshChoices(); }
  if(e.target.id==="clearChoice"){ state.choice=[null,null,null]; save(); refreshChoices(); }
  if(e.target.id==="submitBtn") submitChoice();
  if(e.target.id==="refreshStats") loadStats();
});
app.addEventListener("submit", e=>{ if(e.target.id==="loginForm"){ e.preventDefault(); doLogin(e.target); } });
userBtn.addEventListener("click", ()=>{ state.switching=false; state.loginErr={}; go("login"); });
app.addEventListener("input", e=>{
  if(e.target.id==="stuId") e.target.value = e.target.value.replace(/\D/g,"");
  if(e.target.id!=="otherText") return;
  state.otherText = e.target.value; save();
  document.getElementById("otherHint").textContent = dreamHint(state.otherText);
  document.getElementById("next").disabled = !state.otherText.trim();
});
app.addEventListener("keydown", e=>{
  if(e.target.id==="otherText" && e.key==="Enter" && !e.isComposing && state.otherText.trim()){ state.step++; render(); }
});
backBtn.addEventListener("click", ()=>{
  if(state.view==="school"||state.view==="compare") go(state.from==="result"&&done()?"result":"home");
  else if(state.view==="quiz"){ if(state.step>-1){state.step--; render();} else go("home"); }
  else go("home");
});
const brand=document.getElementById("brand");
brand.addEventListener("click",()=>go("home"));
brand.addEventListener("keydown",e=>{ if(e.key==="Enter") go("home"); });
render();
</script>
</body>
</html>
